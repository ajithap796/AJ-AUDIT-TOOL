<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dff3ea">
<title>HSM &amp; Co – Voucher Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--tx:#0e1f1a;--mu:rgba(14,31,26,.56);
--gl:linear-gradient(150deg,rgba(255,255,255,.66),rgba(255,255,255,.26) 55%,rgba(255,255,255,.4));
--sh:rgba(16,60,48,.22);--hl:rgba(255,255,255,.95);--ac:#0a9d6b;
--row:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.36));--rowhl:rgba(255,255,255,.8);
--bg1:#e6f8ef;--bg2:#e0effc;--bg3:#efe8fc;--b1:#34d399;--b2:#38bdf8;--b3:#a78bfa;--b4:#fcd34d;--bo:.7;--pt:#064e3b;--pg:linear-gradient(160deg,rgba(255,255,255,.6),rgba(52,211,153,.4) 48%,rgba(10,157,107,.34))}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--tx:#f2f7f5;--mu:rgba(242,247,245,.58);
--gl:linear-gradient(150deg,rgba(255,255,255,.2),rgba(255,255,255,.06) 55%,rgba(255,255,255,.1));
--sh:rgba(0,0,0,.55);--hl:rgba(255,255,255,.4);--ac:#34d399;
--row:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.06));--rowhl:rgba(255,255,255,.22);
--bg1:#06120f;--bg2:#08131c;--bg3:#0f0b1d;--bo:.55;--pt:#eafff6;--pg:linear-gradient(160deg,rgba(255,255,255,.28),rgba(52,211,153,.3) 48%,rgba(10,157,107,.26))}}
:root[data-theme="dark"]{--tx:#f2f7f5;--mu:rgba(242,247,245,.58);
--gl:linear-gradient(150deg,rgba(255,255,255,.2),rgba(255,255,255,.06) 55%,rgba(255,255,255,.1));
--sh:rgba(0,0,0,.55);--hl:rgba(255,255,255,.4);--ac:#34d399;
--row:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.06));--rowhl:rgba(255,255,255,.22);
--bg1:#06120f;--bg2:#08131c;--bg3:#0f0b1d;--bo:.55;--pt:#eafff6;--pg:linear-gradient(160deg,rgba(255,255,255,.28),rgba(52,211,153,.3) 48%,rgba(10,157,107,.26))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg1);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2.5px solid var(--ac);outline-offset:2px}

/* ambient light */
.blobs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;contain:strict;background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3))}
.blobs i{position:absolute;border-radius:50%;background:radial-gradient(closest-side,var(--c) 28%,transparent 100%);opacity:var(--bo);animation:fl 18s ease-in-out infinite alternate;will-change:transform}
.blobs i:nth-child(1){width:76vmax;height:76vmax;--c:var(--b1);left:-29vmax;top:-25vmax}
.blobs i:nth-child(2){width:64vmax;height:64vmax;--c:var(--b2);right:-26vmax;top:calc(18vh - 6vmax);animation-delay:-5s;animation-duration:22s}
.blobs i:nth-child(3){width:56vmax;height:56vmax;--c:var(--b3);left:calc(8vw - 5vmax);bottom:-29vmax;animation-delay:-9s}
.blobs i:nth-child(4){width:34vmax;height:34vmax;--c:var(--b4);right:calc(6vw - 4vmax);bottom:calc(10vh - 4vmax);opacity:calc(var(--bo) * .5);animation-delay:-12s;animation-duration:26s}
@keyframes fl{0%{transform:translate(0,0) scale(1)}50%{transform:translate(5vmax,-4vmax) scale(1.12)}100%{transform:translate(-4vmax,5vmax) scale(1.05)}}

main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:54px 16px 150px}

/* liquid glass */
.glass{position:relative;background:var(--gl);
backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);
box-shadow:inset 0 1.5px 0 var(--hl),inset 0 -1.5px 1px rgba(255,255,255,.14),inset 0 0 22px rgba(255,255,255,.1),0 22px 50px -14px var(--sh),0 3px 8px rgba(0,0,0,.05)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.3px;pointer-events:none;
background:linear-gradient(140deg,rgba(255,255,255,.98),rgba(255,255,255,.14) 32%,rgba(255,255,255,.04) 62%,rgba(255,255,255,.75));
-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:var(--sp,0);transition:opacity .4s ease;
background:radial-gradient(260px circle at var(--mx,30%) var(--my,0%),rgba(255,255,255,.5),rgba(255,255,255,0) 62%)}

/* top bar (appears when scrolling) */
.bar{position:fixed;top:0;left:0;right:0;z-index:8;height:calc(48px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;
background:linear-gradient(180deg,var(--bg1),transparent);opacity:0;pointer-events:none;transition:opacity .3s;
backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);
-webkit-mask:linear-gradient(#000 70%,transparent);mask:linear-gradient(#000 70%,transparent)}
.bar.show{opacity:1}

.brand{margin:0 4px;color:var(--ac);font-weight:700;font-size:15px;letter-spacing:.01em;animation:up .8s cubic-bezier(.2,.9,.3,1.1) backwards}
h1{font-size:42px;letter-spacing:-.035em;margin:2px 4px 0;font-weight:800;line-height:1.05;animation:up .8s .06s cubic-bezier(.2,.9,.3,1.1) backwards}
.sub{margin:6px 4px 22px;color:var(--mu);font-size:15px;animation:up .8s .12s cubic-bezier(.2,.9,.3,1.1) backwards}
@keyframes up{from{opacity:0;transform:translateY(26px) scale(.97);filter:blur(6px)}}
@keyframes upn{from{opacity:0;transform:translateY(26px) scale(.97)}}

/* tools card */
.tools{border-radius:30px;padding:8px;margin-bottom:22px;animation:upn .8s .2s cubic-bezier(.2,.9,.3,1.1) backwards}
.tools .rowi{margin:0;background:transparent;box-shadow:none;border-radius:22px}
.tools .rowi+.rowi{margin-top:2px}
.ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;color:#fff;font-weight:800;font-size:15px;
box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -6px 10px rgba(0,0,0,.12),0 4px 10px rgba(0,0,0,.18)}
.ic svg{width:21px;height:21px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.g{background:linear-gradient(160deg,#5eead4,#0a9d6b)}.ic.b{background:linear-gradient(160deg,#7dd3fc,#2563eb)}.ic.o{background:linear-gradient(160deg,#fdba74,#ea580c)}
.rowi .tl{flex:1;min-width:0}
.rowi .tl b{display:block;font-size:16px;font-weight:650}
.rowi .tl span{display:block;color:var(--mu);font-size:13px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* voucher card */
.v{border-radius:32px;padding:16px;margin-bottom:18px;animation:pop .7s cubic-bezier(.2,1.15,.3,1.1) backwards;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(34px)}}
.v.q{animation:none}
#list.lite .v{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--row)}
#list.huge .v{content-visibility:auto;contain-intrinsic-size:auto 430px}
.vh{display:flex;justify-content:space-between;align-items:center;margin:2px 4px 12px}
.vh b{font-size:18px;letter-spacing:-.01em}
.rm{border:0;background:var(--row);box-shadow:inset 0 1px 0 var(--rowhl);color:#ff453a;font-family:inherit;font-weight:600;font-size:13px;border-radius:99px;padding:7px 14px;cursor:pointer;transition:transform .35s cubic-bezier(.3,1.7,.5,1)}
.rm:active{transform:scale(.88)}

.rowi{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--row);box-shadow:inset 0 1px 0 var(--rowhl),0 1px 2px rgba(0,0,0,.04);border-radius:20px;padding:11px 15px;margin-bottom:8px;cursor:pointer;min-height:54px;
transition:transform .4s cubic-bezier(.3,1.6,.5,1),background .25s,box-shadow .25s}
.rowi:active{transform:scale(.965)}
.rowi small{display:block;color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.01em}
.rowi span.val{font-size:17px;font-weight:600;word-break:break-word}
.rowi .ph{color:var(--mu);font-weight:500}
.rowi em{color:var(--mu);font-style:normal;font-size:22px;line-height:1}
input{font:inherit;color:var(--tx);border:0;outline:0;background:transparent;width:100%;font-size:17px;font-weight:600;padding:0;margin-top:2px}
input[hidden]{display:none}
input::placeholder{color:var(--mu);font-weight:500}
.rowi.in{cursor:text}.rowi.in>div{flex:1}
.rowi.in:focus-within{box-shadow:inset 0 1px 0 var(--rowhl),0 0 0 2.5px var(--ac)}
input[type=date]{color-scheme:light dark}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;padding:0 16px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
.dockin{pointer-events:auto;display:flex;gap:8px;align-items:center;padding:8px;border-radius:99px;width:100%;max-width:520px;animation:dk 1s .35s cubic-bezier(.2,1.1,.3,1.15) backwards}
@keyframes dk{from{opacity:0;transform:translateY(80px) scale(.9)}}
.btn{position:relative;border:0;font-family:inherit;font-weight:700;font-size:15px;border-radius:99px;padding:14px 20px;cursor:pointer;color:var(--tx);background:var(--row);box-shadow:inset 0 1px 0 var(--rowhl);overflow:hidden;transition:transform .45s cubic-bezier(.3,1.7,.5,1),filter .2s}
.btn:active{transform:scale(.92)}
.btn.p{flex:1;color:var(--pt);background:var(--pg);box-shadow:inset 0 1.5px 0 var(--hl),inset 0 0 0 1px rgba(255,255,255,.3),inset 0 -10px 16px -6px rgba(255,255,255,.2),inset 0 0 20px rgba(255,255,255,.1),0 10px 26px -10px rgba(10,157,107,.55),0 2px 6px rgba(0,0,0,.06)}
.btn.p::after{content:"";position:absolute;left:8px;right:8px;top:2px;height:46%;border-radius:99px;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0));opacity:.7;pointer-events:none}
.btn.p::before{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-150%) skewX(-20deg);will-change:transform;animation:sh 4.5s 1.5s ease-in-out infinite;pointer-events:none}
@keyframes sh{0%,60%{transform:translateX(-150%) skewX(-20deg)}100%{transform:translateX(325%) skewX(-20deg)}}
.btn.busy{pointer-events:none;filter:saturate(.8)}
.btn.busy::before{width:60%;transform:translateX(-100%);background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);animation:ld 1.1s linear infinite}
@keyframes ld{from{transform:translateX(-100%)}to{transform:translateX(200%)}}

/* sheets */
.ov{position:fixed;inset:0;z-index:20;background:rgba(10,20,18,.42);display:flex;align-items:flex-end;justify-content:center;animation:fi .3s backwards}
@keyframes fi{from{opacity:0}}
.sheet{width:100%;max-width:560px;max-height:86vh;display:flex;flex-direction:column;border-radius:34px 34px 0 0;padding:10px 14px calc(18px + env(safe-area-inset-bottom,0px));animation:sl .6s cubic-bezier(.2,1.1,.25,1) backwards}
.sheet .sc{overflow:auto;overscroll-behavior:contain;padding:2px 2px 4px}
@keyframes sl{from{transform:translateY(100%)}}
.ov.c{animation:fo .25s forwards}.ov.c .sheet{animation:sd .3s cubic-bezier(.5,0,.8,.4) forwards}
@keyframes fo{to{opacity:0}}@keyframes sd{to{transform:translateY(100%)}}
.gz{flex:none;padding:8px 0 14px;margin:-6px 0 0;touch-action:none;cursor:grab}.gz:active{cursor:grabbing}
.grab{width:42px;height:5px;border-radius:9px;background:var(--mu);opacity:.45;margin:0 auto}
.sheet h3{margin:0 6px 4px;font-size:22px;letter-spacing:-.02em}
.sheet p.m{margin:0 6px 14px;color:var(--mu);font-size:14px}
.grp{margin:14px 8px 6px;color:var(--mu);font-size:13px;font-weight:700}
.opt{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:18px;background:var(--row);box-shadow:inset 0 1px 0 var(--rowhl);margin-bottom:6px;font-weight:600;font-size:17px;cursor:pointer;transition:transform .35s cubic-bezier(.3,1.7,.5,1)}
.opt:active{transform:scale(.97)}
.opt.on{box-shadow:inset 0 1px 0 var(--rowhl),0 0 0 2px var(--ac)}.opt.on::after{content:"✓";color:var(--ac);font-weight:800;animation:tk .4s cubic-bezier(.3,1.8,.5,1)}
@keyframes tk{from{transform:scale(0) rotate(-40deg)}}
.prev{margin:4px 2px 10px;padding:16px;border-radius:20px;background:var(--row);box-shadow:inset 0 1px 0 var(--rowhl);font-size:22px;line-height:1.35;text-align:center;word-break:break-word}
.add{display:flex;gap:8px;margin-top:10px}
.add .rowi{flex:1;margin:0;cursor:text}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.acts .btn{width:100%}

.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:30;padding:13px 22px;border-radius:99px;font-weight:700;animation:tt 2.8s cubic-bezier(.2,1.2,.3,1) both;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
@keyframes tt{0%{opacity:0;transform:translate(-50%,-50px) scale(.8)}12%,82%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-30px) scale(.9)}}

/* dock */
.btn.ib{flex:none;width:54px;height:50px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;letter-spacing:.01em}
.btn.ib svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dockin .btn.p{white-space:nowrap;padding:14px 12px;min-width:0}
.bd{position:absolute;top:1px;right:4px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:#0a9d6b;color:#fff;font:700 10px/17px -apple-system,Helvetica,Arial,sans-serif;font-style:normal;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.bd[hidden]{display:none}
.sheet.tall{max-height:94vh}

/* text style */
.ic.k{background:linear-gradient(160deg,#f9a8d4,#db2777)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.srow{display:flex;align-items:center;gap:12px;margin:2px 8px 6px}
.srow input{flex:1;width:auto}
.srow .sa{font-weight:700;font-size:13px;color:var(--mu)}.srow .sb{font-weight:700;font-size:26px;color:var(--mu);line-height:1}
.srow b{min-width:48px;text-align:right;font-size:16px}
input[type=range]{-webkit-appearance:none;appearance:none;height:30px;background:transparent;margin:0;padding:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:var(--row);box-shadow:inset 0 1px 2px rgba(0,0,0,.18),0 0 0 1px rgba(255,255,255,.35)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-10px;border-radius:50%;background:linear-gradient(160deg,#fff,#dfe9e5);box-shadow:0 3px 10px rgba(0,0,0,.3),inset 0 1px 0 #fff}
input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:var(--row)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:linear-gradient(160deg,#fff,#dfe9e5);box-shadow:0 3px 10px rgba(0,0,0,.3)}
.sw{display:flex;flex-wrap:wrap;gap:12px;margin:4px 8px 10px}
.sw button,.cc{width:44px;height:44px;border-radius:50%;border:0;padding:0;cursor:pointer;position:relative;flex:none;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -5px 8px rgba(0,0,0,.14),0 3px 8px rgba(0,0,0,.18);transition:transform .3s cubic-bezier(.3,1.7,.5,1)}
.sw button{background:var(--c)}
.sw button:active,.cc:active{transform:scale(.88)}
.sw .on{box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -5px 8px rgba(0,0,0,.14),0 0 0 3px var(--bg1),0 0 0 5.5px var(--ac)}
.cc{background:conic-gradient(#ef4444,#f59e0b,#eab308,#22c55e,#06b6d4,#3b82f6,#a855f7,#ef4444);overflow:hidden}
.cc input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0;padding:0}

/* preview */
.zw{overflow:auto;max-height:62vh;border-radius:10px;background:#fff;box-shadow:0 10px 28px -10px var(--sh),0 0 0 1px rgba(0,0,0,.1);margin:2px 2px 10px;-webkit-overflow-scrolling:touch;cursor:zoom-in}
.zw canvas{display:block;width:100%;height:auto}
.zw.z{cursor:zoom-out}.zw.z canvas{width:230%}
/* pause the ambient light while scrolling / while a sheet is open */
.blobs.still i,.blobs.hold i{animation-play-state:paused}

/* supporting documents */
.ic.v2{background:linear-gradient(160deg,#c4b5fd,#7c3aed)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:0 6px 4px}
.seg button{flex:1;min-width:58px;border:0;font-family:inherit;font-weight:700;font-size:16px;color:var(--tx);background:var(--row);box-shadow:inset 0 1px 0 var(--rowhl);border-radius:16px;padding:10px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .3s cubic-bezier(.3,1.7,.5,1)}
.seg button:active{transform:scale(.94)}
.seg button.on{box-shadow:inset 0 1px 0 var(--rowhl),0 0 0 2px var(--ac);color:var(--ac)}
.seg button span{font-size:12px;font-weight:700}
.pvc{display:block;margin:6px auto 8px;width:100%;max-width:300px;height:auto;border-radius:6px;background:#fff;box-shadow:0 10px 28px -10px var(--sh),0 0 0 1px rgba(0,0,0,.08)}
.pg{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:4px;font-weight:600;font-size:14px;color:var(--mu)}
.pg .btn{padding:6px 18px;font-size:20px;line-height:1.2}
.pg .btn:disabled{opacity:.35;pointer-events:none}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px;margin:0 6px 12px}
.thumbs .empty{grid-column:1/-1;margin:4px 0;color:var(--mu);font-size:14px;text-align:center}
.th{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--row);box-shadow:inset 0 1px 0 var(--rowhl);cursor:pointer}
.th img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.th b{position:absolute;left:6px;bottom:6px;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;display:grid;place-items:center}
.th button{position:absolute;top:5px;width:30px;height:30px;border:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.th .r{left:5px}.th .x{right:5px}
.th.sel{box-shadow:0 0 0 3px var(--ac)}
.sheet .acts{flex:none;padding:0 4px}
/* quick fill + name */
.ic.n{background:linear-gradient(160deg,#a5b4fc,#4f46e5)}
.qf{margin:2px 0 8px}
.qfl{margin:0 6px 6px;color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.01em}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chip{border:0;font-family:inherit;font-weight:700;font-size:13px;color:var(--tx);background:var(--row);box-shadow:inset 0 1px 0 var(--rowhl);border-radius:16px;padding:9px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;transition:transform .3s cubic-bezier(.3,1.7,.5,1)}
.chip:active{transform:scale(.94)}
.chip span{font-size:12px;font-weight:700;color:var(--mu)}
.chip.on{box-shadow:inset 0 1px 0 var(--rowhl),0 0 0 2px var(--ac);color:var(--ac)}
.chip.on span{color:var(--ac)}
/* glass orbs (top right) */
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.hl{flex:1;min-width:0}
.orbs{flex:none;margin:2px 0 0;display:grid;grid-template-columns:repeat(2,46px);gap:8px;z-index:2}
.orb{width:46px;height:46px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;cursor:pointer;color:var(--c);font-family:inherit;animation:orbin .7s cubic-bezier(.2,1.2,.3,1) backwards;animation-delay:calc(var(--i) * 70ms + 200ms);transition:transform .4s cubic-bezier(.3,1.7,.5,1)}
.orb:active{transform:scale(.84)}
.orb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.orb b{font-size:16px;font-weight:800;letter-spacing:-.02em}
@keyframes orbin{from{opacity:0;transform:scale(.3)}}
/* bubbles that fly out of the tapped spot to the top right */
.bubs{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:40;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none;max-width:min(80vw,330px)}
.bub{display:flex;align-items:center;gap:9px;padding:11px 17px 11px 13px;border-radius:99px;font-weight:700;font-size:14px;will-change:transform,opacity}
.bub i{width:9px;height:9px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 3px rgba(10,157,107,.25);flex:none}
.sheet.o{animation:so .55s cubic-bezier(.2,1.1,.3,1) backwards}
@keyframes so{from{opacity:0;transform:scale(.2)}}
/* smooth + light */
.blobs i{animation:none!important;will-change:auto}
.bar,.v,.tools{backdrop-filter:none;-webkit-backdrop-filter:none}
.v::after{display:none}
:root{--sb:linear-gradient(150deg,rgba(255,255,255,.94),rgba(236,250,244,.92) 60%,rgba(242,238,252,.94))}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--sb:linear-gradient(150deg,rgba(42,50,48,.97),rgba(22,28,30,.96))}}
:root[data-theme="dark"]{--sb:linear-gradient(150deg,rgba(42,50,48,.97),rgba(22,28,30,.96))}
.sheet.glass{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--sb)}
.ov.c{animation:fo .32s ease-in forwards}
.ov.c .sheet{animation:none}
.sheet,.bub,.v{backface-visibility:hidden}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* summary & reports */
.ic.s{background:linear-gradient(160deg,#fcd34d,#f59e0b)}
.fr{display:flex;gap:8px;margin:0 2px}.fr .rowi{flex:1;min-width:0;margin-bottom:8px}
.seg.tb2{margin:2px 2px 10px;flex-wrap:nowrap}.seg.tb2 button{font-size:13px;min-width:0;padding:10px 2px}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 2px}
.kp{background:var(--row);box-shadow:inset 0 1px 0 var(--rowhl);border-radius:18px;padding:12px 14px;min-width:0;animation:upn .6s cubic-bezier(.2,1,.3,1) backwards}
.kp small{display:block;color:var(--mu);font-size:12px;font-weight:600}
.kp b{display:block;font-size:20px;letter-spacing:-.02em;margin-top:2px;word-break:break-word}
.kp span{display:block;color:var(--mu);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg{margin:16px 2px 0}.sg h4{margin:0 4px 8px;font-size:14px;color:var(--mu);font-weight:700}
.tw{overflow-x:auto;border-radius:16px;background:var(--row);box-shadow:inset 0 1px 0 var(--rowhl);-webkit-overflow-scrolling:touch}
table.tb{border-collapse:collapse;width:100%;font-size:13.5px;white-space:nowrap}
.tb th,.tb td{padding:9px 12px;text-align:right}.tb th:first-child,.tb td:first-child{text-align:left}
.tb th{color:var(--mu);font-size:12px;font-weight:700;border-bottom:1px solid rgba(128,128,128,.25)}
.tb td{border-bottom:1px solid rgba(128,128,128,.12)}.tb tbody tr:last-child td{border-bottom:0}
.tb tfoot td{font-weight:800;border-top:1.5px solid rgba(128,128,128,.35)}
.hb .hr{margin-bottom:10px}.hn{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:4px}
.hn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ht{height:10px;border-radius:99px;background:rgba(128,128,128,.18);overflow:hidden}
.ht i{display:block;height:100%;width:0;border-radius:99px;background:var(--c);animation:gw .9s cubic-bezier(.2,1,.3,1) forwards}
@keyframes gw{to{width:var(--w)}}
.dn{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.dsv{width:170px;height:170px;flex:none;margin:0 auto}
.dsv circle{animation:dz .8s cubic-bezier(.2,1,.3,1) backwards}@keyframes dz{from{opacity:0;stroke-width:4}}
.lg{flex:1;min-width:150px;font-size:14px}.lg div{display:flex;align-items:center;gap:8px;padding:4px 0}
.lg i{width:11px;height:11px;border-radius:50%;flex:none}.lg span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cw{overflow-x:auto;color:var(--tx);background:var(--row);box-shadow:inset 0 1px 0 var(--rowhl);border-radius:16px;padding:4px 0}.cw svg{display:block;margin:0 auto}
.cw rect{transform-box:fill-box;transform-origin:bottom;animation:gy .8s cubic-bezier(.2,1.1,.3,1) backwards}@keyframes gy{from{transform:scaleY(0)}}
.cw text{fill:currentColor;font-size:10px}
.ln{stroke-dasharray:1;stroke-dashoffset:0;animation:dr 1.3s cubic-bezier(.3,.7,.3,1) backwards}@keyframes dr{from{stroke-dashoffset:1}}
.es{text-align:center;color:var(--mu);padding:28px 8px;line-height:1.5}
.fadeb{animation:upn .45s cubic-bezier(.2,1,.3,1)}

const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
const two=n=>n<20?ones[n]:tens[Math.floor(n/10)]+(n%10?' '+ones[n%10]:'');
const three=n=>(n>=100?ones[Math.floor(n/100)]+' Hundred'+(n%100?' ':''):'')+(n%100?two(n%100):'');
function inr(r){if(!r)return'';const p=[],cr=Math.floor(r/1e7);r%=1e7;const lk=Math.floor(r/1e5);r%=1e5;const th=Math.floor(r/1e3);r%=1e3;
 if(cr)p.push(inr(cr)+' Crore');if(lk)p.push(two(lk)+' Lakh');if(th)p.push(two(th)+' Thousand');if(r)p.push(three(r));return p.join(' ')}
function words(a){const n=Math.round(parseFloat(a)*100);if(!n||n<0)return'';const r=Math.floor(n/100),ps=n%100;let s=inr(r)||'Zero';if(ps)s+=' and '+two(ps)+' Paise';return s+' Only'}

function swipe(ov,sh,fling){
 let y0=0,ly=0,lt=0,v=0,dy=0,on=false,cand=false,pid=null;
 const begin=(y,t)=>{cand=true;const sc=t.closest&&t.closest('.sc');if(sc&&sc.scrollTop>0)cand=false;
  if(t.closest&&t.closest('input[type=range],[data-nodrag]'))cand=false;y0=ly=y;lt=performance.now();v=0;dy=0;on=false};

  if(!on){if(d<-8){cand=false;return}
   if(d<=8)return;

   on=true;sh.style.animation='none';sh.style.transition='none'}
  if(e.cancelable)e.preventDefault();

  const n=performance.now();v=(y-ly)/Math.max(1,n-lt);ly=y;lt=n};

  if(dy>Math.min(140,sh.offsetHeight*.25)||v>.55)fling();
  else{sh.style.transition='transform .35s cubic-bezier(.2,1.1,.3,1)';sh.style.transform=''}};
 sh.addEventListener('touchstart',e=>{if(e.touches.length===1)begin(e.touches[0].clientY,e.target);else cand=false},{passive:true});

 // mouse / pen: drag the handle

const PS=[{x:0,d:177,t:248,p:314,w:381,b:[145,440,525,490]},{x:0,d:715,t:785,p:848,w:912,b:[145,969,525,1017]},{x:7,d:1254,t:1330,p:1398,w:1468,b:[145,1529,529,1582]}];

const bgP=new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=BG});
const stripsP=bgP.then(im=>{const out=[];
 for(let i=0;i<3;i++){const c=document.createElement('canvas');c.width=1240;c.height=H[i];c.getContext('2d').drawImage(im,0,T[i],1240,H[i],0,0,1240,H[i]);out.push(c.toDataURL('image/jpeg',.95))}return out});

function drawText(ctx,v,s,f,sc=SC,oy=T[s]){
 const P=PS[s];ctx.setTransform(sc,0,0,sc,0,0);ctx.fillStyle=TXT.c;ctx.textBaseline='alphabetic';
 const put=(txt,x,yb,maxW,pt,bold)=>{let px=pt*PXPT*f.k*TXT.s;const wt=bold&&f.w?700:400;const set=()=>ctx.font=wt+' '+px+'px '+fam(f);set();
  while(px>6&&ctx.measureText(txt).width>maxW){px-=.6;set()}ctx.fillText(txt,x,yb-oy)};
 if(v.dt)put(fd(v.dt),968+P.x,P.d-4,180,11);
 if(v.to)put(v.to,258+P.x,P.t-4,885,12);
 if(v.wd)put(v.wd,388+P.x,P.p-4,750,12);
 if(v.tw)put(v.tw,234+P.x,P.w-4,910,12);
 if(v.am){const a=parseFloat(v.am);put((isNaN(a)?v.am:a.toLocaleString('en-IN',{maximumFractionDigits:2}))+' /-',205,(P.b[1]+P.b[3])/2+7,310,15,true)}
}
let busy=false;
async function makePdf(o,btn){
 if(busy)return;
 const vs=o.vouchers?[...list.children].map(c=>c._d):[];
 const useDocs=!!o.docs&&DOCS.length>0;
 if(!vs.length&&!useDocs){toast(o.vouchers?'Add a voucher first':'Add images first');return}
 if(!window.jspdf){toast('PDF tools did not load – check internet');return}
 busy=true;const old=btn.textContent;btn.classList.add('busy');btn.textContent='Preparing…';toast('Preparing your PDF…');
 try{
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4',compress:true});
  if(vs.length){
   const strips=await stripsP;await loadFont(curFont);await document.fonts.ready;
   const cv=document.createElement('canvas');cv.width=1240*SC;
   for(let i=0;i<vs.length;i++){
    const pg=Math.floor(i/3),s=i%3;if(s===0&&pg>0)doc.addPage();
    cv.height=H[s]*SC;const ctx=cv.getContext('2d');ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
    drawText(ctx,vs[i],s,curFont);

    doc.addImage(cv.toDataURL('image/png'),'PNG',0,T[s]*K,210,H[s]*K,undefined,'FAST');
    if(vs.length>3){btn.textContent=(i+1)+' / '+vs.length;await new Promise(r=>setTimeout(r))}
   }
  }
  if(useDocs){
   const per=CO.n,[cols,rows]=LAY[CO.n][CO.l],np=Math.ceil(DOCS.length/per);
   const cv=document.createElement('canvas');cv.width=PW;cv.height=PH;const ctx=cv.getContext('2d');
   for(let p=0;p<np;p++){
    btn.textContent='Collage '+(p+1)+' / '+np;
    if(vs.length||p>0)doc.addPage();
    await paintPage(ctx,PW,DOCS.slice(p*per,(p+1)*per),cols,rows,CO.f,pdfGet,false);
    doc.addImage(cv.toDataURL('image/jpeg',.9),'JPEG',0,0,210,297,undefined,'FAST');
    await new Promise(r=>setTimeout(r));
   }
   cv.width=cv.height=0;
  }
  doc.save(vs.length?'HSM_Vouchers.pdf':'HSM_Supporting_Documents.pdf');toast('PDF downloaded ✓');
 }catch(err){console.error(err);toast('Could not create the PDF')}
 finally{busy=false;btn.classList.remove('busy');btn.textContent=old}}

const BK=[[50,'Up to ₹50'],[100,'₹51 – 100'],[200,'₹101 – 200'],[500,'₹201 – 500'],[1000,'₹501 – 1,000'],[Infinity,'Above ₹1,000']];
const bucket=a=>BK.findIndex(b=>a<=b[0]);
const monthL=k=>new Date(k+'-01T00:00:00').toLocaleDateString('en-IN',{month:'long',year:'numeric'});

const VW={
 ov(o){const t=sumA(o),n=o.length,it=grp(o,v=>v.tw).sort(byT),pe=grp(o,v=>v.to).sort(byT),dy=grp(o,v=>v.dt).sort((a,b)=>a.k<b.k?-1:1),
  hi=o.reduce((a,b)=>b.a>a.a?b:a),lo=o.reduce((a,b)=>b.a<a.a?b:a),bd=dy.slice().sort(byT)[0];
  return'<div class="kg">'+kp('Total amount',mny(t),'',0)+kp('Vouchers',n,dy.length+(dy.length===1?' day':' days'),1)+kp('Average',mny(t/n),'per voucher',2)+kp('Highest',mny(hi.a),esc(hi.tw)+' · '+esc(hi.to),3)+kp('Lowest',mny(lo.a),esc(lo.tw)+' · '+esc(lo.to),4)+kp('Busiest day',mny(bd.t),fd(bd.k)+' · '+bd.n+(bd.n===1?' voucher':' vouchers'),5)+kp('Top item',esc(it[0].k),mny(it[0].t),6)+kp('Top person',esc(pe[0].k),mny(pe[0].t),7)+'</div>'+
  sec('Amount by item',donut(it,t))+sec('Amount by day',cols(dy,r=>fd(r.k).slice(0,5)))+sec('Amount by person',bars(pe.slice(0,8)))},
 day(o){const t=sumA(o),dy=grp(o,v=>v.dt).sort((a,b)=>a.k<b.k?-1:1);let c=0;const cum=dy.map(r=>({k:r.k,c:(c+=r.t)})),
  mo=grp(o,v=>v.dt.slice(0,7)).sort((a,b)=>a.k<b.k?-1:1),wd=grp(o,v=>wkd(v.dt)).sort((a,b)=>WD.indexOf(a.k)-WD.indexOf(b.k));
  return sec('Amount per day',cols(dy,r=>fd(r.k).slice(0,5)))+sec('Running total',line(cum,r=>fd(r.k).slice(0,5)))+
  sec('Day-wise table',tbl(['Date','Day','Vouchers','Total','Share','Average'],dy.map(r=>[fd(r.k),wkd(r.k),r.n,'<b>'+mny(r.t)+'</b>',pct(r.t,t),mny(r.t/r.n)]),['Total','',o.length,mny(t),'100%',mny(t/o.length)]))+
  sec('Month-wise',tbl(['Month','Vouchers','Total','Share'],mo.map(r=>[monthL(r.k),r.n,'<b>'+mny(r.t)+'</b>',pct(r.t,t)])))+
  sec('Weekday-wise',bars(wd))+sec('Day × Item',mxh(mtx(o,v=>v.dt,v=>v.tw,'k'),'Date'))},
 item(o){const t=sumA(o),g=grp(o,v=>v.tw).sort(byT);
  return sec('Share by item',donut(g,t))+sec('Amount by item',bars(g))+sec('Number of vouchers',bars(g.map(r=>({k:r.k,t:r.n})).sort(byT),n=>n+' ×'))+sec('Item-wise table',aggT(g,t,'Item'))+sec('Item × Person',mxh(mtx(o,v=>v.tw,v=>v.to),'Item'))},
 per(o){const t=sumA(o),g=grp(o,v=>v.to).sort(byT);
  return sec('Amount by person',bars(g))+sec('Share by person',donut(g,t))+sec('Person-wise table',aggT(g,t,'Person'))+sec('Person × Item',mxh(mtx(o,v=>v.to,v=>v.tw),'Person'))+sec('Person × Day',mxh(mtx(o,v=>v.to,v=>fd(v.dt)),'Person'))},
 amt(o){const t=sumA(o),g=grp(o,v=>v.a).sort((a,b)=>a.k-b.k),b=grp(o,v=>bucket(v.a)).sort((a,c)=>a.k-c.k).map(r=>({k:BK[r.k][1],n:r.n,t:r.t})),
  top=o.slice().sort((a,c)=>c.a-a.a).slice(0,5);
  return sec('How often each amount was paid',bars(g.map(r=>({k:mny(r.k),t:r.n})),n=>n+' ×'))+
  sec('Amount-wise table',tbl(['Amount','Vouchers','Total','Share'],g.map(r=>[mny(r.k),r.n,'<b>'+mny(r.t)+'</b>',pct(r.t,t)]),['Total',o.length,mny(t),'100%']))+
  sec('Amount ranges',cols(b.map(r=>({k:r.k,t:r.n})),r=>r.k,n=>n+'×'))+
  sec('Range table',tbl(['Range','Vouchers','Total','Share'],b.map(r=>[r.k,r.n,'<b>'+mny(r.t)+'</b>',pct(r.t,t)])))+
  sec('Largest vouchers',tbl(['Date','To','Towards','Amount'],top.map(v=>[fd(v.dt),esc(v.to),esc(v.tw),'<b>'+mny(v.a)+'</b>'])))}
};

function xlsxSummary(o){
 if(!window.XLSX){toast('Excel tools did not load – check internet');return}
 const wb=XLSX.utils.book_new(),add=(n,rows,w)=>{const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=(w||[]).map(x=>({wch:x}));XLSX.utils.book_append_sheet(wb,ws,n)},t=sumA(o);
 const ag=(g,first,fk)=>[[first,'Vouchers','Total','Share %','Average','Min','Max']].concat(g.map(r=>[fk?fk(r.k):r.k,r.n,r.t,Math.round(r.t/t*1000)/10,Math.round(r.t/r.n*100)/100,r.mn,r.mx]),[['Total',o.length,t,100,Math.round(t/o.length*100)/100,'','']]);
 const mx=(M,first,fk)=>[[first].concat(M.C,['Total'])].concat(M.R.map(r=>[fk?fk(r):r].concat(M.C.map(c=>M.g(r,c)||''),[M.rt[r]])),[['Total'].concat(M.C.map(c=>M.ct[c]),[M.tot])]);
 add('Vouchers',[['Date','To Mr./Mrs.','Amount','Towards']].concat(o.slice().sort((a,b)=>a.dt<b.dt?-1:1).map(v=>[fd(v.dt),v.to,v.a,v.tw])),[12,26,12,24]);
 add('Day-wise',ag(grp(o,v=>v.dt).sort((a,b)=>a.k<b.k?-1:1),'Date',fd),[14,10,12,10,12,10,10]);
 add('Item-wise',ag(grp(o,v=>v.tw).sort(byT),'Item'),[24,10,12,10,12,10,10]);
 add('Person-wise',ag(grp(o,v=>v.to).sort(byT),'Person'),[26,10,12,10,12,10,10]);
 add('Amount-wise',[['Amount','Vouchers','Total']].concat(grp(o,v=>v.a).sort((a,b)=>a.k-b.k).map(r=>[r.k,r.n,r.t])),[12,10,12]);
 add('Day x Item',mx(mtx(o,v=>v.dt,v=>v.tw,'k'),'Date',fd),[14]);
 add('Person x Item',mx(mtx(o,v=>v.to,v=>v.tw),'Person'),[26]);
 XLSX.writeFile(wb,'HSM_Voucher_Summary.xlsx');toast('Summary downloaded ✓')}

function sumSheet(){
 const TABS=[['ov','Overview'],['day','Days'],['item','Items'],['per','People'],['amt','Amounts']];let tab='ov',cur=[];
 const S=mk('<h3>Summary &amp; reports</h3><p class="m" id="sm"></p><div class="sc"><div class="fr"><label class="rowi in"><div><small>From</small><input id="sf" type="date"></div></label><label class="rowi in"><div><small>To</small><input id="st" type="date"></div></label></div>'+
  '<div class="seg tb2" id="tabs">'+TABS.map(t=>'<button data-t="'+t[0]+'">'+t[1]+'</button>').join('')+'</div><div id="sb"></div></div>'+
  '<div class="acts"><button class="btn p" id="sx">Download Excel summary</button><button class="btn" id="sok">Close</button></div>');
 S.ov.firstChild.classList.add('tall');
 const render=()=>{
  const f=S.q('#sf').value,t=S.q('#st').value;let skip=0;
  cur=[...list.children].map(c=>c._d).reduce((o,d)=>{const a=parseFloat(d.am);if(!(a>0)){skip++;return o}if((f&&d.dt<f)||(t&&d.dt>t))return o;o.push({dt:d.dt||today(),to:(d.to||'').trim()||NA,tw:(d.tw||'').trim()||NA,a});return o},[]);
  S.q('#sm').textContent=cur.length?cur.length+(cur.length===1?' voucher':' vouchers')+' · '+mny(sumA(cur))+(skip?' · '+skip+' without an amount left out':''):'Charts and tables of the vouchers you have entered.';
  S.ov.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  const b=S.q('#sb');b.className='fadeb';void b.offsetWidth;
  b.innerHTML=cur.length?VW[tab](cur):'<p class="es">No vouchers with an amount'+((f||t)?' in this date range':' yet')+'.<br>Fill in amounts and come back.</p>';
  S.q('#sx').style.display=cur.length?'':'none'};
 S.q('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;S.q('.sc').scrollTop=0;render()};
 S.q('#sf').onchange=S.q('#st').onchange=render;
 S.q('#sx').onclick=()=>xlsxSummary(cur);S.q('#sok').onclick=S.close;render()}
$('#sumRow').onclick=sumSheet;

/* ---------- glass light that follows your finger / cursor ---------- */
let hot=null,raf=0,pe=null;
const litT=e=>{pe=e;if(!raf)raf=requestAnimationFrame(()=>{raf=0;lit(pe)})};
const lit=e=>{const g=e.target.closest&&e.target.closest('.glass');if(hot&&hot!==g)hot.style.setProperty('--sp',0);
 if(g){const r=g.getBoundingClientRect();g.style.setProperty('--mx',(e.clientX-r.left)+'px');g.style.setProperty('--my',(e.clientY-r.top)+'px');g.style.setProperty('--sp',1)}hot=g};
document.addEventListener('pointermove',e=>{if(e.pointerType!=='touch')litT(e)},{passive:true});document.addEventListener('pointerdown',lit,{passive:true});
document.addEventListener('pointerup',()=>{const h=hot;if(h)setTimeout(()=>h.style.setProperty('--sp',0),450)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches&&e.target.matches('.rowi[role=button]'))e.target.click()});

let stt=0;addEventListener('scroll',()=>{blobs.classList.add('still');clearTimeout(stt);stt=setTimeout(()=>blobs.classList.remove('still'),160)},{passive:true});

/* top bar fades in when the big title scrolls away */
new IntersectionObserver(([en])=>$('#bar').classList.toggle('show',!en.isIntersecting)).observe($('#ttl'));
</script></body></html>
